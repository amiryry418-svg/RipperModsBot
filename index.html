        "FastA1b2", "FastC3d4", "FastE5f6", "FastG7h8", "FastI9j0",
        "CoolA1b2", "CoolC3d4", "CoolE5f6", "CoolG7h8", "CoolI9j0",
        "StarA1b2", "StarC3d4", "StarE5f6", "StarG7h8", "StarI9j0",
        "GoldA1b2", "GoldC3d4", "GoldE5f6", "GoldG7h8", "GoldI9j0"
    ];

    function checkPassword() {
        const password = document.getElementById('pass-input').value.trim();
        const messageEl = document.getElementById('message');
        
        if (!password) {
            messageEl.textContent = '❌ لطفاً رمز را وارد کنید';
            messageEl.className = 'error';
            return;
        }

        let usedPasswords = JSON.parse(localStorage.getItem('usedPasswords') || '[]');

        if (usedPasswords.includes(password)) {
            messageEl.textContent = '❌ این رمز قبلاً استفاده شده است!';
            messageEl.className = 'error';
            return;
        }

        if (VALID_PASSWORDS.includes(password)) {
            usedPasswords.push(password);
            localStorage.setItem('usedPasswords', JSON.stringify(usedPasswords));

            messageEl.textContent = '✅ رمز صحیح است!';
            messageEl.className = 'success';
            document.getElementById('password-section').style.display = 'none';
            document.getElementById('download-links').style.display = 'block';
        } else {
            messageEl.textContent = '❌ رمز نامعتبر است!';
            messageEl.className = 'error';
        }
    }
