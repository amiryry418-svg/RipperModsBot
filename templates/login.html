{% extends "base.html" %}
{% block title %}ورود{% endblock %}
{% block content %}
<div style="max-width: 450px; margin: 40px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 30px; color: var(--primary);">🔐 ورود به حساب</h2>
        <form method="POST" action="/login">
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" name="email" class="form-control" value="{{ email or '' }}" required placeholder="example@email.com" dir="ltr" style="text-align: left;">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••" dir="ltr" style="text-align: left;">
            </div>
            <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 1.05rem;">ورود</button>
        </form>
        <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
            حساب ندارید؟ <a href="/register">ثبت‌نام کنید</a>
        </p>
    </div>
</div>
{% endblock %}
