{% extends "base.html" %}

{% block title %}ورود | RipperMods{% endblock %}

{% block content %}
<section class="hero" style="padding: 80px 0;">
    <div class="wrap" style="display: flex; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 420px; animation: fadeInUp 0.8s ease-out;">
            <h2 style="text-align: center; color: var(--red); margin-bottom: 10px;">ورود به RipperMods</h2>
            <p style="text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 30px;">ایمیل خود را وارد کنید تا کد ورود برایتان ارسال شود.</p>

            <form method="POST">
                <div class="form-group">
                    <label>ایمیل</label>
                    <input type="email" name="email" class="form-control" placeholder="example@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-2">
                    <i class="fa-solid fa-paper-plane"></i> دریافت کد ورود
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted);">
                حساب ندارید؟ <a href="{{ url_for('register') }}" style="color: var(--red); font-weight: bold;">ثبت‌نام</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
