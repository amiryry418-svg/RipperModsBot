{% extends "base.html" %}

{% block title %}تایید کد | RipperMods{% endblock %}

{% block content %}
<section class="hero" style="padding: 80px 0;">
    <div class="wrap" style="display: flex; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 420px; animation: fadeInUp 0.8s ease-out; text-align: center;">
            <h2 style="color: var(--red); margin-bottom: 10px;">کد تایید را وارد کنید</h2>
            <p style="color: var(--muted); font-size: 14px; margin-bottom: 30px;">کد ۶ رقمی به ایمیل شما ارسال شد. (اعتبار ۲ دقیقه)</p>

            <form method="POST">
                <div class="form-group">
                    <input type="text" name="code" class="form-control" placeholder="------" maxlength="6" required autocomplete="off" style="text-align: center; font-size: 24px; letter-spacing: 8px;">
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-2">
                    <i class="fa-solid fa-check"></i> تایید و ورود
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
