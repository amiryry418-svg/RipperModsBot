{% extends "base.html" %}
{% block title %}ورود مدیران{% endblock %}
{% block content %}
<div style="max-width: 450px; margin: 60px auto;">
    <div class="card" style="border-color: var(--accent);">
        <h2 style="text-align: center; margin-bottom: 30px; color: var(--accent);">👑 ورود مدیران</h2>
        <form method="POST" action="/admin/login">
            <div class="form-group">
                <label>نام کاربری</label>
                <input type="text" name="username" class="form-control" required dir="ltr" style="text-align: left;">
            </div>
            <div class="form-group">
                <label>رمز عبور</label>
                <input type="password" name="password" class="form-control" required dir="ltr" style="text-align: left;">
            </div>
            <button type="submit" class="btn btn-accent" style="width: 100%; padding: 12px; font-size: 1.05rem;">ورود به پنل</button>
        </form>
    </div>
</div>
{% endblock %}
