{% extends "base.html" %}
{% block title %}ثبت‌نام{% endblock %}
{% block content %}
<div style="max-width: 450px; margin: 40px auto;">
    <div class="card">
        <h2 style="text-align: center; margin-bottom: 30px; color: var(--primary);">📝 ساخت حساب کاربری</h2>
        <form method="POST" action="/register">
            <div class="form-group">
                <label>نام نمایشی (اختیاری)</label>
                <input type="text" name="display_name" class="form-control" value="{{ display or '' }}" placeholder="مثلاً: علی رضایی">
            </div>
            <div class="form-group">
                <label>ایمیل</label>
                <input type="email" name="email" class="form-control" value="{{ email or '' }}" required placeholder="example@email.com" dir="ltr" style="text-align: left;">
            </div>
            <div class="form-group">
                <label>رمز عبور (حداقل ۶ کاراکتر)</label>
                <input type="password" name="password" class="form-control" required minlength="6" placeholder="••••••••" dir="ltr" style="text-align: left;">
            </div>
            <button type="submit" class="btn" style="width: 100%; padding: 12px; font-size: 1.05rem;">ثبت‌نام</button>
        </form>
        <p style="text-align: center; margin-top: 20px; color: var(--text-muted);">
            حساب دارید؟ <a href="/login">وارد شوید</a>
        </p>
    </div>
</div>
{% endblock %}
