{% extends "base.html" %}

{% block title %}ثبت‌نام | RipperMods{% endblock %}

{% block content %}
<section class="hero" style="padding: 60px 0;">
    <div class="wrap" style="display: flex; justify-content: center;">
        <div class="card" style="width: 100%; max-width: 450px; animation: fadeInUp 0.8s ease-out;">
            <h2 style="text-align: center; color: var(--red); margin-bottom: 10px;">ثبت‌نام در RipperMods</h2>
            <p style="text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 30px;">برای استفاده از سایت، لطفاً اطلاعات زیر را وارد کنید.</p>

            <form method="POST">
                <div class="form-group">
                    <label>نام و نام خانوادگی</label>
                    <input type="text" name="full_name" class="form-control" placeholder="مثال: علی رضایی" required>
                </div>
                <div class="form-group">
                    <label>شماره موبایل</label>
                    <input type="tel" name="phone" class="form-control" placeholder="09123456789" required>
                </div>
                <div class="form-group">
                    <label>ایمیل (برای دریافت کد)</label>
                    <input type="email" name="email" class="form-control" placeholder="example@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary btn-block mt-2">
                    <i class="fa-solid fa-user-plus"></i> دریافت کد تایید
                </button>
            </form>

            <div style="text-align: center; margin-top: 20px; font-size: 14px; color: var(--muted);">
                قبلاً ثبت‌نام کردید؟ <a href="{{ url_for('login') }}" style="color: var(--red); font-weight: bold;">ورود</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
