<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت‌نام | RipperMods</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <style>
        body { font-family: 'Vazirmatn', sans-serif; background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background-color: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); width: 100%; max-width: 400px; border: 1px solid #334155; }
        h2 { text-align: center; color: #06b6d4; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background-color: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #fff; font-family: inherit; box-sizing: border-box; }
        input:focus { outline: none; border-color: #06b6d4; box-shadow: 0 0 10px rgba(6, 182, 212, 0.3); }
        button { width: 100%; padding: 12px; background-color: #06b6d4; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background-color: #0891b2; }
        .links { text-align: center; margin-top: 15px; font-size: 14px; }
        .links a { color: #06b6d4; text-decoration: none; }
        .flash { padding: 10px; margin-bottom: 15px; border-radius: 8px; text-align: center; font-size: 14px; }
        .flash.error { background-color: #7f1d1d; color: #fca5a5; }
        .flash.success { background-color: #14532d; color: #86efac; }
    </style>
</head>
<body>
    <div class="container">
        <h2>ثبت‌نام در RipperMods</h2>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="text" name="full_name" placeholder="نام و نام خانوادگی" required>
            <input type="tel" name="phone" placeholder="شماره موبایل" required>
            <input type="email" name="email" placeholder="ایمیل (برای دریافت کد)" required>
            <button type="submit">دریافت کد تایید</button>
        </form>
        <div class="links">
            قبلاً ثبت‌نام کردید؟ <a href="{{ url_for('login') }}">ورود</a>
        </div>
    </div>
</body>
</html>
